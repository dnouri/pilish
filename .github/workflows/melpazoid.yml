# melpazoid <https://github.com/riscy/melpazoid> build checks.
# Catches stylistic issues like top-level define-key, bolp suggestions, etc.

name: melpazoid

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install
      run: |
        sudo apt-get update && sudo apt-get install -y emacs
        emacs --version
        git clone https://github.com/riscy/melpazoid.git ~/melpazoid
        python - <<'PY'
        from pathlib import Path
        dockerfile = Path.home() / "melpazoid/docker/Dockerfile"
        source = dockerfile.read_text()
        mirror = "https://mirrors.kernel.org/gnu/emacs/"
        if source.count(mirror) != 1:
            raise SystemExit("Expected exactly one Emacs mirror URL in melpazoid Dockerfile")
        dockerfile.write_text(source.replace(mirror, "https://ftp.gnu.org/gnu/emacs/"))
        PY
    - name: Run
      env:
        LOCAL_REPO: ${{ github.workspace }}
        RECIPE: (pilish :fetcher github :repo "dnouri/pilish" :old-names (pi-coding-agent) :files (:defaults ("assets" "assets/pilish-logo.svg")))
        WARN_IS_ERROR: false
        EXIST_OK: true
      run: make -C ~/melpazoid DOCKER_OUTPUT=--progress=plain
